  <rect x="120" y="416" width="560" height="6" rx="3" fill="#1e222a"/>
  <rect x="120" y="416" width="224" height="6" rx="3" fill="#f4f5f7" opacity="0.9"/>
  <rect x="352" y="438" width="96" height="8" rx="4" fill="#2a2f38"/>
