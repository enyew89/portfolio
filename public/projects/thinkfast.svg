    <rect x="170" y="283" width="150" height="10" rx="4" fill="#c7ccd4"/>
  </g>
  <g>
    <rect x="412" y="262" width="268" height="52" rx="10" fill="#161a20" stroke="#e5e7eb" stroke-width="1.5"/>
    <circle cx="438" cy="288" r="12" fill="#f4f5f7"/>
    <text x="438" y="292" font-family="monospace" font-size="11" fill="#000" text-anchor="middle">B</text>
    <rect x="462" y="283" width="130" height="10" rx="4" fill="#e5e7eb"/>
  </g>
  <g>
    <rect x="120" y="330" width="268" height="52" rx="10" fill="#161a20" stroke="#2a2f38" stroke-width="1"/>
    <circle cx="146" cy="356" r="12" fill="#1e222a"/>
    <text x="146" y="360" font-family="monospace" font-size="11" fill="#9aa1ac" text-anchor="middle">C</text>
    <rect x="170" y="351" width="168" height="10" rx="4" fill="#c7ccd4"/>
  </g>
  <g>
    <rect x="412" y="330" width="268" height="52" rx="10" fill="#161a20" stroke="#2a2f38" stroke-width="1"/>
    <circle cx="438" cy="356" r="12" fill="#1e222a"/>
    <text x="438" y="360" font-family="monospace" font-size="11" fill="#9aa1ac" text-anchor="middle">D</text>
